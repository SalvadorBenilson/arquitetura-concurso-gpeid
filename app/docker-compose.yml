version: '3.8'

services:
  # Balanceador de Carga (Porta de entrada do sistema)
  nginx:
    image: nginx:alpine
    container_name: gpeid_load_balancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_node_1
      - app_node_2
      - app_node_3
    networks:
      - network_gpeid
    restart: always

  # Instância 1 da Aplicação
  app_node_1:
    build: .
    container_name: gpeid_app_1
    expose:
      - "3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis_cache:6379/0
      - RABBITMQ_URL=amqp://user:password@rabbitmq_queue:5672
    depends_on:
      - redis_cache
      - rabbitmq_queue
    networks:
      - network_gpeid
    restart: always

  # Instância 2 da Aplicação
  app_node_2:
    build: .
    container_name: gpeid_app_2
    expose:
      - "3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis_cache:6379/0
      - RABBITMQ_URL=amqp://user:password@rabbitmq_queue:5672
    depends_on:
      - redis_cache
      - rabbitmq_queue
    networks:
      - network_gpeid
    restart: always

  # Instância 3 da Aplicação
  app_node_3:
    build: .
    container_name: gpeid_app_3
    expose:
      - "3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis_cache:6379/0
      - RABBITMQ_URL=amqp://user:password@rabbitmq_queue:5672
    depends_on:
      - redis_cache
      - rabbitmq_queue
    networks:
      - network_gpeid
    restart: always

  # Cache de Sessões e Rate Limiting
  redis_cache:
    image: redis:alpine
    container_name: gpeid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - network_gpeid
    restart: always

  # Fila Assíncrona para Upload de PDFs e Inscrições
  rabbitmq_queue:
    image: rabbitmq:3-management-alpine
    container_name: gpeid_rabbitmq
    ports:
      - "5672:5672"   # Porta de comunicação da fila
      - "15672:15672" # Painel Web de Gestão do RabbitMQ
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - network_gpeid
    restart: always

networks:
  network_gpeid:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
